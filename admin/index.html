<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ – ซินแสหวาง Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=12" />
</head>
<body class="admin-body">
<div class="admin-login-page">
  <div class="login-card">
    <div class="login-header">
      <span class="login-logo-zh">王</span>
      <h1>ซินแสหวาง</h1>
      <p>ระบบจัดการเว็บไซต์ · Admin Panel</p>
    </div>
    <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
      <div>
        <label for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" name="username" placeholder="กรอกชื่อผู้ใช้" required autocomplete="username" />
      </div>
      <div>
        <label for="password">รหัสผ่าน</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password" style="padding-right: 40px; width: 100%; box-sizing: border-box;" />
          <button type="button" id="togglePassword" onclick="togglePass()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--gray-400, #a0aec0); padding: 0; display: flex; align-items: center; justify-content: center; outline: none;">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <div id="loginError" style="color:#e57373;font-size:0.8rem;display:none;text-align:center;"></div>
      <button type="submit" class="btn-login" id="loginBtn" style="margin-top: 1rem;">เข้าสู่ระบบ</button>
    </form>
    <p style="text-align:center;margin-top:1.5rem;font-size:0.75rem;color:var(--gray-600);">
      <a href="/index.html" style="color:var(--gold-bright);">← กลับหน้าหลัก</a>
    </p>
  </div>
</div>
<script>
function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  btn.textContent = 'กำลังตรวจสอบ...'; btn.disabled = true;
  
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p })
  })
  .then(res => res.json().then(data => ({ status: res.status, ok: res.ok, body: data })))
  .then(res => {
    if (res.ok) {
      sessionStorage.setItem('admin_auth', btoa(u + ':' + Date.now()));
      sessionStorage.setItem('admin_key', p);
      window.location.href = '/admin/dashboard.html';
    } else {
      err.textContent = res.body.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; 
      err.style.display = 'block';
      btn.textContent = 'เข้าสู่ระบบ'; 
      btn.disabled = false;
    }
  })
  .catch(error => {
    err.textContent = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
    err.style.display = 'block';
    btn.textContent = 'เข้าสู่ระบบ'; 
    btn.disabled = false;
  });
}
function togglePass() {
  const pwd = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
  } else {
    pwd.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  }
}
// Auto redirect if already logged in
if (sessionStorage.getItem('admin_auth')) window.location.href = '/admin/dashboard.html';
</script>
</body>
</html>
